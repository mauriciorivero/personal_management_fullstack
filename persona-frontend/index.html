<!doctype html>
<!--
  index.html
  =====================================================================
  UNICA pagina HTML de la aplicacion.

  Es una SPA (Single Page Application, aplicacion de una sola pagina):
  todo el contenido lo construye JavaScript dentro de #aplicacion y la
  navegacion cambia el fragmento de la URL (#usuarios, #telefonos)
  sin recargar nada.

  POR QUE EL HTML ES TAN CORTO?
  Porque los componentes del Atomic Design generan el DOM en
  JavaScript. Este archivo solo aporta:
    - los metadatos de la pagina (<head>),
    - el contenedor raiz,
    - el mensaje para quien tenga JavaScript desactivado.

  ============== IMPORTANTE: NO ABRIR CON DOBLE CLIC ==============
  Este archivo usa modulos ES (<script type="module">), que el
  navegador BLOQUEA con el protocolo file:// por la politica de mismo
  origen. Hay que servirlo por HTTP:

      cd persona-frontend
      npx serve -l 5500

  y abrir http://localhost:5500
  =================================================================
-->
<html lang="es">
  <head>
    <!--
      charset tiene que ser una de las primeras cosas del <head>: si
      se declara despues, el navegador ya empezo a interpretar los
      bytes con otra codificacion y las tildes y enies salen mal.
    -->
    <meta charset="utf-8" />

    <!--
      La etiqueta viewport es OBLIGATORIA para el diseno responsivo.
      Sin ella, el movil finge una pantalla de 980px y "aleja" la
      pagina: las media queries de movil nunca se activan.

        width=device-width -> usa el ancho real del dispositivo
        initial-scale=1    -> sin zoom inicial

      Nunca se pone maximum-scale=1 ni user-scalable=no: eso impide
      al usuario ampliar la pagina, y para alguien con baja vision es
      una barrera de accesibilidad grave.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="Aplicacion formativa de gestion de usuarios, telefonos, redes sociales y perfiles sociales. Consume una API REST hecha con Node.js, Express y MySQL."
    />

    <!--
      color-scheme le avisa al navegador que la pagina soporta los dos
      temas. Con eso, los controles nativos (barras de desplazamiento,
      calendarios, desplegables) se pintan oscuros en tema oscuro.
      Sin esta linea queda un calendario blanco sobre fondo negro.
    -->
    <meta name="color-scheme" content="light dark" />

    <title>Usuarios · Personal Management</title>

    <!--
      Favicon en linea (data URI con un SVG). No genera ninguna
      peticion de red y evita el 404 de /favicon.ico que ensucia la
      consola del navegador.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E"
    />

    <!--
      Una sola hoja de estilos. main.css importa los 26 archivos del
      sistema de diseno en el orden correcto del Atomic Design:
      tokens, base, atomos, moleculas, organismos, plantillas, paginas.
    -->
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <!--
      Contenedor raiz. JavaScript monta aqui toda la aplicacion.
      Arranca con un mensaje de carga por si los modulos tardan.
    -->
    <div id="aplicacion">
      <div class="a-cargador-bloque" role="status" aria-live="polite">
        <span class="a-cargador a-cargador--grande" aria-hidden="true"></span>
        <p>Cargando la aplicacion...</p>
      </div>
    </div>

    <!--
      <noscript> solo se muestra si el usuario tiene JavaScript
      desactivado. Es una cortesia importante: sin este bloque veria
      una pagina en blanco, sin ninguna explicacion.
    -->
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto">
        <h1>JavaScript es necesario</h1>
        <p>
          Esta aplicacion construye su interfaz con JavaScript y consume una API REST,
          asi que necesita que JavaScript este activado en el navegador.
        </p>
        <p>
          Si solo quieres ver los datos, puedes consultar la API directamente en
          <code>http://localhost:3000/api/usuarios</code>
        </p>
      </div>
    </noscript>

    <!--
      type="module" hace tres cosas:
        1. Habilita import y export dentro del archivo.
        2. Activa el modo estricto de JavaScript de forma automatica.
        3. Aplica `defer`: el script corre cuando el HTML ya se parseo,
           asi que el DOM siempre esta listo.

      Solo cargamos UN archivo: main.js importa todo lo demas. El
      navegador resuelve el arbol de dependencias por su cuenta.
    -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
